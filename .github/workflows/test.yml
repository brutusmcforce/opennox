name: Test
on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  libs:
    name: Vet and test libraries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: List packages
        # packages that need cgo (the SDL/OpenGL seats) are covered by the game build
        run: |
          go list -e -f '{{if not .Error}}{{if not .DepsErrors}}{{.ImportPath}}{{end}}{{end}}' \
            ./libs/... ./noxcrypt/... ./lobby/... ./nat/... ./noxscript/... ./opennoxcontrol/... ./vqa-decode/... \
            > "$RUNNER_TEMP/packages.txt"
          wc -l < "$RUNNER_TEMP/packages.txt"

      - name: Vet
        run: go vet $(cat "$RUNNER_TEMP/packages.txt")

      - name: Test
        run: go test -short -timeout 10m $(cat "$RUNNER_TEMP/packages.txt")

  lint64:
    name: 64-bit layout lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # raw 386 offsets into moved struct fields and pointers kept in 32-bit integers; see the script
      - name: Lint
        run: scripts/ci/lint-64bit.sh
