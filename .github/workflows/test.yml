name: Test
on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  libs:
    name: Vet and test libraries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon (arm64)
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    env:
      CGO_ENABLED: "0"
      # the same codegen as the release builds (internal/noxbuild): no fused multiply-add, so that
      # arm64 (macos-14 here) computes the same floats as x86
      GOCOMPILEDEBUG: fmahash=qn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: List packages
        # library packages; the game itself is covered by the build and the e2e test
        run: |
          go list -e -f '{{if not .Error}}{{if not .DepsErrors}}{{.ImportPath}}{{end}}{{end}}' \
            ./libs/... ./noxcrypt/... ./lobby/... ./nat/... ./noxscript/... ./opennoxcontrol/... ./vqa-decode/... \
            > "$RUNNER_TEMP/packages.txt"
          wc -l < "$RUNNER_TEMP/packages.txt"

      - name: Vet
        # unsafeptr is off: the native bindings (libs/sdl, libs/gl, libs/dynlib) turn addresses that come
        # from SDL and OpenGL into pointers, which is what the check warns about and cannot be written any
        # other way. It cannot be turned off per package, because go vet also reports a package's dependencies.
        run: go vet -unsafeptr=false $(cat "$RUNNER_TEMP/packages.txt")

      - name: Test
        run: go test -short -timeout 10m $(cat "$RUNNER_TEMP/packages.txt")

  cross:
    name: Build for all platforms
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    env:
      CGO_ENABLED: "0"
      # the same codegen as the release builds (internal/noxbuild): no fused multiply-add, so that
      # arm64 (macos-14 here) computes the same floats as x86
      GOCOMPILEDEBUG: fmahash=qn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # no cgo: every target builds from Linux
      - name: Build
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/opennox
            GOOS=${target%/*} GOARCH=${target#*/} go build -tags server -o /dev/null ./cmd/opennox-server
          done

  lint64:
    name: 64-bit layout lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # raw 386 offsets into moved struct fields and pointers kept in 32-bit integers; see the script
      - name: Lint
        run: scripts/ci/lint-64bit.sh

  fma:
    name: Float determinism (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # arm64 fuses multiply-add and so computes different floats than x86; see the script
      - name: Lint
        run: scripts/ci/lint-fma.sh
