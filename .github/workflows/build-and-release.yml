name: Build and release
on:
  push:
    branches:
      - main
      - master
      - dev
      - ci_tests
      - dennwc
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - master
      - dev

env:
  DOCKER_IMAGE_NAME: ghcr.io/brutusmcforce/opennox

jobs:
  windows_docker:
    # Build Windows binaries in Debian (no C compiler needed), see scripts/ci/build-windows.sh
    name: Build for Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Get go cache
        uses: actions/cache@v4
        with:
          path: gocache
          key: mingw-gocache-v5-${{ hashFiles('**/go.sum', 'src/go.mod', 'scripts/ci/*') }}
          restore-keys: |
            mingw-gocache-v5-

      - name: Build
        run: docker run --rm --platform linux/amd64 -v "$PWD:/w" -w /w debian:bookworm scripts/ci/build-windows.sh

      - uses: actions/upload-artifact@v4
        name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/dev') || (github.ref == 'refs/heads/ci_tests')
        with:
          name: opennox-win
          path: |
            build/opennox.exe
            build/opennox-debug.exe
            build/opennox-server.exe
            build/*.dll
          if-no-files-found: error
          retention-days: 1

  linux_docker:
    # Build Linux binaries in 64-bit Debian, see scripts/ci/build-linux.sh
    name: Build for Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Get go cache
        uses: actions/cache@v4
        with:
          path: gocache
          key: linux-gocache-v5-${{ hashFiles('**/go.sum', 'src/go.mod', 'scripts/ci/*') }}
          restore-keys: |
            linux-gocache-v5-

      # Debian 12, so the binaries run on any distribution with glibc 2.36 or newer
      - name: Build
        run: docker run --rm --platform linux/amd64 -v "$PWD:/w" -w /w debian:bookworm scripts/ci/build-linux.sh

      - uses: actions/upload-artifact@v4
        name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/dev') || (github.ref == 'refs/heads/ci_tests')
        with:
          name: opennox-linux
          path: |
            build/opennox
            build/opennox-server
          if-no-files-found: error
          retention-days: 1

  linux_arm64_appimage:
    # The Linux binaries and the AppImage for 64-bit ARM (Raspberry Pi and other ARM computers), built natively on an
    # ARM runner in Debian 12, like the x86_64 ones (scripts/ci/build-linux.sh, scripts/appimage/build.sh)
    name: Build for Linux ARM64 (AppImage)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Get go cache
        uses: actions/cache@v4
        with:
          path: gocache
          key: linux-arm64-gocache-v1-${{ hashFiles('**/go.sum', 'src/go.mod', 'scripts/ci/*', 'scripts/appimage/*') }}
          restore-keys: |
            linux-arm64-gocache-v1-

      - name: Build
        run: docker run --rm --platform linux/arm64 -v "$PWD:/w" -w /w debian:bookworm sh -c 'scripts/ci/build-linux.sh && scripts/appimage/build.sh'

      - uses: actions/upload-artifact@v4
        name: Upload the AppImage
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/dev') || (github.ref == 'refs/heads/ci_tests')
        with:
          name: opennox-release-linux-appimage-arm64
          path: build/opennox-bundle-aarch64.AppImage
          if-no-files-found: error
          retention-days: 1

  macos:
    # Universal (Apple Silicon and Intel) OpenNox.app with SDL3, see scripts/ci/build-macos.sh
    name: Build for macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Get dependency cache
        uses: actions/cache@v4
        with:
          path: gocache/macos-deps
          key: macos-deps-v1-${{ hashFiles('scripts/ci/build-macos.sh') }}

      - name: Build
        run: scripts/ci/build-macos.sh

      - uses: actions/upload-artifact@v4
        name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/dev') || (github.ref == 'refs/heads/ci_tests')
        with:
          name: opennox-release-macos
          path: build/OpenNox-macos.zip
          if-no-files-found: error
          retention-days: 1

  docker_server:
    name: Docker server build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/dev') || (github.ref == 'refs/heads/ci_tests')
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Docker build
        run: |
          make build-server-docker

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/dev')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push latest
        if: github.ref == 'refs/heads/dev'
        run: |
          docker push $DOCKER_IMAGE_NAME:dev

      - name: Push tagged
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # the tag this build runs for, not the latest-dev tag that may point at the same commit
          export VERSION=$(git tag --points-at HEAD | grep -m1 '^v[0-9]' || git describe --tags --always)
          docker tag $DOCKER_IMAGE_NAME:dev $DOCKER_IMAGE_NAME:${VERSION}
          docker push $DOCKER_IMAGE_NAME:${VERSION}

      - name: Push latest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag $DOCKER_IMAGE_NAME:dev $DOCKER_IMAGE_NAME:latest
          docker push $DOCKER_IMAGE_NAME:latest

  release_repackage_linux_gzip:
    name: Repackage Linux release (tar.gz)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/dev') || (github.ref == 'refs/heads/ci_tests')
    needs: [linux_docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Cleanup
        run: |
          rm -rf /tmp/linux-tmp
          mkdir -p /tmp/linux-tmp

      - uses: actions/download-artifact@v4
        with:
          name: opennox-linux
          path: /tmp/linux-tmp/

      - name: Repackage release
        run: |
          ls -lh /tmp/linux-tmp/

          rm -rf /tmp/opennox-linux
          mkdir -p /tmp/opennox-linux
          cp /tmp/linux-tmp/* /tmp/opennox-linux
          # artifacts don't keep file permissions
          chmod 755 /tmp/opennox-linux/opennox /tmp/opennox-linux/opennox-server
          cp ./CHANGELOG.md /tmp/opennox-linux

          # a version tag that points at this commit wins: the commit can also have the latest-dev tag of
          # the development build, which git describe returns instead (the v1.10.0-alpha3 files were named
          # latest-dev, and so was the version inside the binaries)
          export VERSION=$(git tag --points-at HEAD | grep -m1 '^v[0-9]' || git describe --tags --always)
          cd /tmp/opennox-linux
          rm -rf /tmp/opennox-linux-release
          mkdir -p /tmp/opennox-linux-release
          tar -czf /tmp/opennox-linux-release/OpenNox-linux-$VERSION.tar.gz ./*

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: opennox-release-linux-tgz
          path: /tmp/opennox-linux-release/OpenNox-linux-*.tar.gz
          if-no-files-found: error

  release_repackage_linux_appimage:
    name: Repackage Linux release (AppImage)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/dev') || (github.ref == 'refs/heads/appimage-workflow-test') || (github.ref == 'refs/heads/ci_tests')
    needs: [linux_docker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        name: Retrieving compiled OpenNox
        with:
          name: opennox-linux
          path: build

      # bundles SDL3 (built from source on Debian 12), see scripts/appimage/build.sh
      - name: Build the AppImage
        run: docker run --rm --platform linux/amd64 -v "$PWD:/w" -w /w debian:bookworm scripts/appimage/build.sh

      - uses: actions/upload-artifact@v4
        name: Upload the AppImage
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/dev') || (github.ref == 'refs/heads/appimage-workflow-test') || (github.ref == 'refs/heads/ci_tests')
        with:
          name: opennox-release-linux-appimage
          path: |
            build/opennox-bundle-x86_64.AppImage
          if-no-files-found: error
          retention-days: 1

  release_repackage_win:
    name: Repackage Windows release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/dev') || (github.ref == 'refs/heads/ci_tests')
    needs: [windows_docker]
    steps:
      - name: Install NSIS
        run: sudo apt-get install -y nsis

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Cleanup
        run: |
          rm -rf /tmp/win-tmp
          mkdir -p /tmp/win-tmp

      - uses: actions/download-artifact@v4
        with:
          name: opennox-win
          path: /tmp/win-tmp/

      - name: Repackage release
        run: |
          ls -lh /tmp/win-tmp/
          rm -rf /tmp/opennox-win
          mkdir -p /tmp/opennox-win
          cp /tmp/win-tmp/*.exe /tmp/opennox-win/
          cp /tmp/win-tmp/*.dll /tmp/opennox-win/
          cp ./CHANGELOG.md /tmp/opennox-win/

          rm -rf /tmp/opennox-win-release
          mkdir -p /tmp/opennox-win-release
          # a version tag that points at this commit wins: the commit can also have the latest-dev tag of
          # the development build, which git describe returns instead (the v1.10.0-alpha3 files were named
          # latest-dev, and so was the version inside the binaries)
          export VERSION=$(git tag --points-at HEAD | grep -m1 '^v[0-9]' || git describe --tags --always)
          makensis -DVERSION="$VERSION" -DDATA="/tmp/opennox-win/" -DOUTDIR="/tmp/opennox-win-release/" ./scripts/opennox.nsi

          cd /tmp/opennox-win
          zip -9 -r /tmp/opennox-win-release/OpenNox-$VERSION.zip ./*

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: opennox-release-win
          path: |
            /tmp/opennox-win-release/OpenNox-*.zip
            /tmp/opennox-win-release/OpenNox-*.exe
          if-no-files-found: error

  github_release:
    name: Github release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/dev')
    needs:
      [
        release_repackage_linux_appimage,
        release_repackage_linux_gzip,
        release_repackage_win,
        macos,
        linux_arm64_appimage,
      ]
    # pushes to dev replace the same pre-release, so they must not run at the same time
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Cleanup
        run: |
          rm -rf /tmp/release-tmp
          mkdir -p /tmp/release-tmp

      - uses: actions/download-artifact@v4
        name: Preparing Linux (tar.gz) file for release.
        with:
          name: opennox-release-linux-tgz
          path: /tmp/release-tmp/

      - uses: actions/download-artifact@v4
        name: Preparing Linux (AppImage) file for release.
        with:
          name: opennox-release-linux-appimage
          path: /tmp/release-tmp/

      - uses: actions/download-artifact@v4
        name: Preparing Windows (NSIS installer, Zip archive) files for release.
        with:
          name: opennox-release-win
          path: /tmp/release-tmp/

      - uses: actions/download-artifact@v4
        name: Preparing Linux ARM64 (AppImage) file for release.
        with:
          name: opennox-release-linux-appimage-arm64
          path: /tmp/release-tmp/

      - uses: actions/download-artifact@v4
        name: Preparing macOS (Zip archive) file for release.
        with:
          name: opennox-release-macos
          path: /tmp/release-tmp/

      - name: Name the macOS archive after the version
        run: |
          cd /tmp/release-tmp
          mv OpenNox-macos.zip "OpenNox-macos-${GITHUB_REF_NAME//\//-}.zip"

      - name: Releasing prepared files.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            TODO: changelog
          draft: true
          fail_on_unmatched_files: true
          files: |
            /tmp/release-tmp/opennox-bundle-x86_64.AppImage
            /tmp/release-tmp/opennox-bundle-aarch64.AppImage
            /tmp/release-tmp/OpenNox-linux-*.tar.gz
            /tmp/release-tmp/OpenNox-*.zip
            /tmp/release-tmp/OpenNox-*.exe

      # Every push to dev replaces a single pre-release (tag latest-dev), so the latest build is always downloadable.
      # It's never marked as the latest release, so tagged releases stay the main download.
      # Tags pushed with GITHUB_TOKEN don't trigger workflows, so this doesn't start another build.
      - name: Publish the development build
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-dev --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest-dev" 2>/dev/null || true # a leftover tag would pin the old commit
          gh release create latest-dev --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "Automatic build of the dev branch at ${GITHUB_SHA::8}. It may be unstable; see the releases with version tags for stable builds." \
            /tmp/release-tmp/opennox-bundle-x86_64.AppImage \
            /tmp/release-tmp/opennox-bundle-aarch64.AppImage \
            /tmp/release-tmp/OpenNox-linux-*.tar.gz \
            /tmp/release-tmp/OpenNox-*.zip \
            /tmp/release-tmp/OpenNox-*.exe
