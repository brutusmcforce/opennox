# Multiplayer test, host side (run with scripts/e2e-multiplayer.sh together with mp-client.yaml).
# Hosts an arena game on BluDeath like host.yaml, then switches to real-time pace and keeps the game running
# while the client joins. It brings the client next to its player (action gather, like the "tp" cheat) and both
# fight; the players' health is logged before and after (action players). Screens are written for review, not compared: two processes don't share timing.
